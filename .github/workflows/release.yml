name: Makekey Release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          rustup target add ${{ inputs.target }}
          cargo build --release --verbose --target ${{ inputs.target }}

      - name: Upload Artifacts (windows)
        if: ${{ contains(inputs.target, 'windows') }}
        uses: actions/upload-artifact@v7
        with:
          name: makekey-${{ inputs.target }}
          path: ./target/${{ inputs.target }}/release/makekey.exe

      - name: Upload Artifacts (mac/linux)
        if: ${{ !contains(inputs.target, 'windows') }}
        uses: actions/upload-artifact@v7
        with:
          name: makekey-${{ inputs.target }}
          path: ./target/${{ inputs.target }}/release/makekey

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt install -y yq
          VERSION=$(tomlq -r '.package.version' Cargo.toml)

          for folder in artifacts/*; do
            if [ -f "$folder/makekey.exe" ]; then
              mv "$folder/makekey.exe" "$folder-${VERSION}.exe"
              rm -r "$folder"
            else
              mv "$folder/makekey" "$folder-${VERSION}"
              rm -r "$folder"
            fi
          done

          gh release create "${{ github.ref }}" \
            --draft \
            --title "${VERSION}"

          gh release upload "${{ github.ref }}" "artifacts/*" --clobber